version: '3.8'

services:
  logdiagnostix:
    build: .
    container_name: logdiagnostix-dashboard
    restart: always
    ports:
      - "80:80"
    environment:
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
